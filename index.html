<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>外苑いちょう並木　最後の一葉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="crosshair"></div>
  <div id="stats">
    <div class="row"><span class="lbl">経過</span><span id="time">0:00</span></div>
    <div class="row"><span class="lbl">葉のある木</span><span id="alive">146</span><small>/146</small></div>
    <div class="row"><span class="lbl">並木の葉</span><span id="ratio">100%</span></div>
    <div class="row"><span class="lbl">よみがえらせた木</span><span id="restored">0</span></div>
    <div class="row"><span class="lbl">つかんだ葉</span><span id="caught">0</span></div>
    <div id="phase">見頃</div>
  </div>
  <div id="climb" class="hidden">木登り中（幹へ進むと登る・離れる方向で降りる / Space:幹を蹴ってジャンプ）</div>
  <div id="gaugeWrap"><div class="lbl">ジャンプ（Space：押し続けるほど高く上がる）</div><div id="gauge"><div id="gaugeFill"></div></div></div>
  <canvas id="minimap" width="96" height="300"></canvas>
  <button id="bgmBtn" class="bgmBtn" title="BGMの切り替え（M）">♪ BGM オン（M）</button>
  <div id="toast"></div>
  <div id="hint">枯れかけた木には光る玉が出る。触れるとよみがえる！（根元・てっぺん・幹の途中）</div>
  <div id="touchUI">
    <div id="stick"><div id="knob"></div></div>
    <button id="btnJump">ジャンプ</button>
  </div>
</div>

<!-- Title -->
<div id="title" class="overlay">
  <div class="panel">
    <div class="sub">明治神宮外苑・晩秋</div>
    <h1>外苑いちょう並木<span>最後の一葉</span></h1>
    <p class="story">イチョウを枯らさないで。</p>
    <div class="btns">
      <button id="startBtn">並木を歩きはじめる</button>
      <a class="btn2" href="howto.html">遊び方</a>
    </div>
    <div class="btns" style="margin-top:12px"><button class="bgmBtn btn3">♪ BGM オン（M）</button></div>
    <div class="note">落ち葉が地面に着く前につかむと、願いが叶うとも言われています。</div>
  </div>
</div>

<!-- Pause -->
<div id="pause" class="overlay hidden">
  <div class="panel small">
    <h2>ひと休み</h2>
    <button id="resumeBtn">クリックで再開</button>
    <div class="btns" style="margin-top:12px"><button class="bgmBtn btn3">♪ BGM オン（M）</button></div>
  </div>
</div>

<!-- Game over -->
<div id="over" class="overlay hidden">
  <div class="panel">
    <div class="sub" id="overSub">最後の一葉が散りました</div>
    <h2 id="overTitle">並木に冬が来た</h2>
    <div id="result"></div>
    <div class="btns">
      <button id="retryBtn">もう一度、秋へ</button>
      <a class="btn2" href="howto.html">遊び方</a>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
